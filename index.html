<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>발표자료 모음</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />
    <style>
      :root {
        --bg: #f3f1ec;
        --bg-alt: #e8e4db;
        --ink: #15130f;
        --ink-2: #3f3a32;
        --mute: #756f63;
        --line: rgba(21, 19, 15, 0.16);
        --line-soft: rgba(21, 19, 15, 0.09);
        --accent: #a83f1f;
        --serif: 'Instrument Serif', 'Pretendard Variable', serif;
        --sans: 'Pretendard Variable', -apple-system, BlinkMacSystemFont,
          'Apple SD Gothic Neo', sans-serif;
        --mono: 'JetBrains Mono', ui-monospace, monospace;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        font-feature-settings: 'ss01', 'cv11';
        -webkit-font-smoothing: antialiased;
        word-break: keep-all;
        overflow-wrap: break-word;
        display: flex;
        flex-direction: column;
        padding: 9vh 8vw;
      }

      .eyebrow {
        font-family: var(--mono);
        font-size: 13px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink-2);
        display: flex;
        align-items: center;
        gap: 14px;
        font-weight: 500;
        margin-bottom: 28px;
      }

      .eyebrow::before {
        content: '';
        width: 28px;
        height: 1px;
        background: var(--ink);
      }

      h1 {
        font-family: var(--serif);
        font-weight: 400;
        font-size: clamp(48px, 8vw, 104px);
        line-height: 0.96;
        letter-spacing: -0.02em;
      }

      h1 em {
        font-style: italic;
        color: var(--accent);
      }

      .lede {
        font-size: clamp(15px, 1.3vw, 18px);
        line-height: 1.55;
        color: var(--ink-2);
        max-width: 46ch;
        margin-top: 22px;
      }

      .cards {
        margin-top: clamp(40px, 6vh, 72px);
        border-top: 1px solid var(--line);
      }

      .card {
        display: grid;
        grid-template-columns: 64px 1fr auto;
        gap: 28px;
        align-items: center;
        padding: 28px 8px;
        border-bottom: 1px solid var(--line-soft);
        text-decoration: none;
        color: inherit;
        position: relative;
        transition:
          padding 0.35s ease,
          background 0.35s ease;
      }

      .card::after {
        content: '';
        position: absolute;
        left: 0;
        bottom: -1px;
        height: 1px;
        width: 0;
        background: var(--accent);
        transition: width 0.4s ease;
      }

      .card:hover {
        background: rgba(255, 255, 255, 0.45);
        padding-left: 20px;
        padding-right: 20px;
      }

      .card:hover::after {
        width: 100%;
      }

      .card-num {
        font-family: var(--mono);
        font-size: 13px;
        color: var(--mute);
        letter-spacing: 0.1em;
      }

      .card-title {
        font-family: var(--serif);
        font-size: clamp(28px, 3.4vw, 44px);
        line-height: 1.1;
        letter-spacing: -0.01em;
      }

      .card-title .sub {
        color: var(--mute);
        font-style: italic;
        font-size: 0.58em;
        margin-left: 10px;
      }

      .card-desc {
        font-size: clamp(14px, 1.1vw, 16px);
        color: var(--ink-2);
        margin-top: 8px;
        line-height: 1.5;
        max-width: 52ch;
      }

      .card-tag {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--mute);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-top: 10px;
        display: inline-block;
      }

      .arrow {
        font-family: var(--serif);
        font-size: 32px;
        color: var(--ink);
        transition:
          transform 0.35s ease,
          color 0.35s ease;
      }

      .card:hover .arrow {
        transform: translateX(8px);
        color: var(--accent);
      }

      footer {
        margin-top: auto;
        padding-top: 48px;
        font-family: var(--mono);
        font-size: 12px;
        letter-spacing: 0.06em;
        color: var(--mute);
        display: flex;
        gap: 20px;
      }

      @media (max-width: 680px) {
        .card {
          grid-template-columns: 1fr auto;
          gap: 18px;
        }
        .card-num {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="eyebrow">Presentations · 발표자료</div>
    <h1>발표<em>자료</em>.</h1>
    <p class="lede">팀 발표자료 모음입니다. 아래에서 골라 들어가세요.</p>

    <nav class="cards">
      <a class="card" href="jiktong/">
        <div class="card-num">01</div>
        <div>
          <div class="card-title">직통<span class="sub">直 · 通</span></div>
          <div class="card-desc">
            직군과 직통으로 통한다 &mdash; 슬랙 한&nbsp;번의 멘션으로
            전문용어를 누구나 아는&nbsp;말로.
          </div>
          <span class="card-tag">AX Project · Team 03</span>
        </div>
        <div class="arrow">&rarr;</div>
      </a>
      <a class="card" href="knowbis/">
        <div class="card-num">02</div>
        <div>
          <div class="card-title">노비스<span class="sub">Knowbis</span></div>
          <div class="card-desc">전사 월간리뷰.</div>
          <span class="card-tag">Monthly Review</span>
        </div>
        <div class="arrow">&rarr;</div>
      </a>
      <a class="card" href="piewatch/">
        <div class="card-num">03</div>
        <div>
          <div class="card-title">PieWatch <span class="sub" style="font-style: normal">🐶</span></div>
          <div class="card-desc">우리 서버를 지켜보는 강아지.</div>
          <span class="card-tag">Server Monitoring</span>
        </div>
        <div class="arrow">&rarr;</div>
      </a>
    </nav>

    <footer>
      <span>2026</span>
      <span>Presentations</span>
    </footer>
  </body>
</html>
